<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IWAMOTO DIRECTORY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <style>
      body {
        background:
          radial-gradient(circle at top, rgba(99, 102, 241, 0.12), transparent 35%),
          linear-gradient(to bottom, #020617, #0f172a 45%, #111827);
      }

      .org-banner {
        position: relative;
        overflow: hidden;
        border: 3px solid rgba(212, 175, 55, 0.9);
        border-left: none;
        border-right: none;
        background:
          linear-gradient(135deg, rgba(10, 14, 20, 0.95), rgba(28, 32, 38, 0.95)),
          #0b0f15;
        box-shadow: inset 0 0 0 1px rgba(212, 175, 55, 0.55);
      }

      .org-banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(135deg, transparent 0%, rgba(212, 175, 55, 0.07) 48%, transparent 100%),
          linear-gradient(45deg, transparent 0%, rgba(212, 175, 55, 0.1) 50%, transparent 100%);
        pointer-events: none;
      }

      .banner-sheen {
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 18px;
        transform: translateY(-50%);
        background: linear-gradient(90deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.92), rgba(212, 175, 55, 0.18));
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.38);
      }

      .banner-content {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 1rem;
        min-height: 260px;
        padding: 1rem 1.25rem;
      }

      .banner-emblem {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 170px;
        filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.5));
      }

      .banner-title {
        position: relative;
        text-align: center;
        font-family: "Georgia", "Times New Roman", serif;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: clamp(3.2rem, 7vw, 8rem);
        line-height: 0.9;
        color: rgba(212, 175, 55, 0.96);
        text-shadow:
          0 2px 0 rgba(158, 116, 20, 0.8),
          0 8px 18px rgba(0, 0, 0, 0.7),
          -2px 0 0 rgba(94, 70, 19, 0.7),
          2px 0 0 rgba(94, 70, 19, 0.7),
          0 -2px 0 rgba(94, 70, 19, 0.7);
        white-space: nowrap;
      }

      .banner-emblem svg {
        width: min(25vw, 260px);
        height: min(25vw, 260px);
      }

      .banner-emblem.right svg {
        transform: scaleX(-1);
      }

      .draggable-row {
        cursor: grab;
      }

      .draggable-row.dragging {
        opacity: 0.5;
        background-color: rgba(99, 102, 241, 0.3) !important;
      }

      .drag-over {
        border-top: 2px solid rgb(99, 102, 241) !important;
      }

      @media (max-width: 768px) {
        .banner-content {
          grid-template-columns: 1fr;
          min-height: 200px;
          gap: 0.25rem;
          padding: 1rem 0.5rem;
        }

        .banner-emblem {
          min-height: 90px;
        }

        .banner-emblem svg {
          width: 120px;
          height: 120px;
        }

        .banner-title {
          font-size: clamp(2.2rem, 11vw, 4.5rem);
          white-space: normal;
          line-height: 0.95;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-slate-100 antialiased">
    <div class="org-banner">
      <div class="banner-sheen"></div>
      <div class="banner-content">
        <div class="banner-emblem left" aria-hidden="true">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="silverGrad" x1="0" x2="1">
                <stop offset="0%" stop-color="#f5f5f5" />
                <stop offset="40%" stop-color="#c8c8c8" />
                <stop offset="100%" stop-color="#a7a7a7" />
              </linearGradient>
            </defs>
            <g transform="translate(10,10)">
              <path d="M100 15 L120 100 L100 185 L80 100 Z" fill="url(#silverGrad)" opacity="0.95"/>
              <path d="M15 100 L100 120 L185 100 L100 80 Z" fill="url(#silverGrad)" opacity="0.92"/>
              <circle cx="100" cy="100" r="38" fill="url(#silverGrad)" opacity="0.8"/>
              <circle cx="100" cy="100" r="52" fill="none" stroke="url(#silverGrad)" stroke-width="10" opacity="0.9"/>
              <path d="M100 22 L110 52 L140 62 L110 72 L100 102 L90 72 L60 62 L90 52 Z" fill="url(#silverGrad)" opacity="0.9"/>
              <path d="M22 100 L52 110 L62 140 L72 110 L102 100 L72 90 L62 60 L52 90 Z" fill="url(#silverGrad)" opacity="0.75"/>
              <path d="M178 100 L148 110 L138 140 L128 110 L94 100 L128 90 L138 60 L148 90 Z" fill="url(#silverGrad)" opacity="0.75"/>
            </g>
          </svg>
        </div>

        <div class="banner-title">岩本一家</div>

        <div class="banner-emblem right" aria-hidden="true">
          <svg viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="silverGrad2" x1="0" x2="1">
                <stop offset="0%" stop-color="#f5f5f5" />
                <stop offset="40%" stop-color="#c8c8c8" />
                <stop offset="100%" stop-color="#a7a7a7" />
              </linearGradient>
            </defs>
            <g transform="translate(10,10)">
              <path d="M100 15 L120 100 L100 185 L80 100 Z" fill="url(#silverGrad2)" opacity="0.95"/>
              <path d="M15 100 L100 120 L185 100 L100 80 Z" fill="url(#silverGrad2)" opacity="0.92"/>
              <circle cx="100" cy="100" r="38" fill="url(#silverGrad2)" opacity="0.8"/>
              <circle cx="100" cy="100" r="52" fill="none" stroke="url(#silverGrad2)" stroke-width="10" opacity="0.9"/>
              <path d="M100 22 L110 52 L140 62 L110 72 L100 102 L90 72 L60 62 L90 52 Z" fill="url(#silverGrad2)" opacity="0.9"/>
              <path d="M22 100 L52 110 L62 140 L72 110 L102 100 L72 90 L62 60 L52 90 Z" fill="url(#silverGrad2)" opacity="0.75"/>
              <path d="M178 100 L148 110 L138 140 L128 110 L94 100 L128 90 L138 60 L148 90 Z" fill="url(#silverGrad2)" opacity="0.75"/>
            </g>
          </svg>
        </div>
      </div>
    </div>

    <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:px-8">
      <div class="overflow-hidden rounded-2xl border border-slate-700/80 bg-slate-900/80 shadow-2xl shadow-indigo-950/30 backdrop-blur">
        <header class="border-b border-slate-700 bg-slate-900/90 px-5 py-6 sm:px-8">
          <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-xs font-semibold uppercase tracking-[0.25em] text-indigo-300">Operations</p>
              <h1 class="mt-2 text-2xl font-bold tracking-tight text-white sm:text-3xl">IWAMOTO DIRECTORY</h1>
              <p class="mt-1 text-sm text-slate-400">Total Members: <span id="memberCount">0</span></p>
            </div>

            <div class="w-full max-w-md">
              <label for="searchInput" class="sr-only">Search by name</label>
              <div class="relative">
                <input
                  id="searchInput"
                  type="text"
                  placeholder="Search members by name..."
                  class="w-full rounded-xl border border-slate-600 bg-slate-800/80 py-3 pl-11 pr-4 text-sm text-white placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                />
                <svg
                  class="pointer-events-none absolute left-3 top-3.5 h-5 w-5 text-slate-400"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  stroke-width="1.8"
                >
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </div>
            </div>
          </div>
        </header>

        <main class="p-4 sm:p-6">
          <div class="mb-8 rounded-xl border border-slate-700 bg-slate-800/50 p-6">
            <h2 class="mb-4 text-lg font-semibold text-white">Add New Member</h2>
            <div class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-5">
              <input
                id="newName"
                type="text"
                placeholder="Name"
                class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
              />
              <input
                id="newRank"
                type="text"
                placeholder="Rank"
                class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
              />
              <input
                id="newRankOrder"
                type="number"
                placeholder="Rank Order (1-5)"
                min="1"
                max="5"
                value="1"
                class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
              />
              <select
                id="newStatus"
                class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
              >
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
              <input
                id="newMerit"
                type="number"
                placeholder="Merit"
                value="0"
                class="rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-white placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
              />
            </div>
            <button
              id="addMemberBtn"
              class="mt-4 rounded-lg bg-indigo-600 px-6 py-2 font-semibold text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 transition"
            >
              Add Member
            </button>
          </div>

          <div class="overflow-x-auto">
            <table class="min-w-full border-separate border-spacing-y-2">
              <thead>
                <tr class="text-left text-xs uppercase tracking-[0.2em] text-slate-400">
                  <th class="px-4 py-3 font-medium">Name</th>
                  <th class="px-4 py-3 font-medium">Rank</th>
                  <th class="px-4 py-3 font-medium">Status</th>
                  <th class="px-4 py-3 font-medium">Merit</th>
                  <th class="px-4 py-3 font-medium">Action</th>
                </tr>
              </thead>
              <tbody id="memberTableBody"></tbody>
            </table>
          </div>
        </main>
      </div>
    </div>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDOwvoGbfKTCu91cik9XwtbGXd1KdeHjgQ",
        authDomain: "iwamoto-directory.firebaseapp.com",
        databaseURL: "https://iwamoto-directory-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "iwamoto-directory",
        storageBucket: "iwamoto-directory.firebasestorage.app",
        messagingSenderId: "1004632684937",
        appId: "1:1004632684937:web:645020220a12855acfc958",
        measurementId: "G-QW5FGVC65H"
      };

      const app = firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const membersRef = db.ref("iwamotoDirectory/members");

      const STORAGE_KEY = "iwamoto-directory-members";
      let members = [];
      let nextId = 1;
      let draggedElement = null;
      window.firebaseReady = false;
      window.firebaseMembersRef = membersRef;

      const tableBody = document.getElementById("memberTableBody");
      const memberCountDisplay = document.getElementById("memberCount");
      const searchInput = document.getElementById("searchInput");
      const addMemberBtn = document.getElementById("addMemberBtn");
      const newNameInput = document.getElementById("newName");
      const newRankInput = document.getElementById("newRank");
      const newRankOrderInput = document.getElementById("newRankOrder");
      const newStatusInput = document.getElementById("newStatus");
      const newMeritInput = document.getElementById("newMerit");

      function loadMembers() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed)) return parsed;
        } catch (error) {
          console.warn("Unable to load saved members:", error);
        }
        return [];
      }

      function saveMembersLocal() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
      }

      function saveMembersCloud() {
        if (window.firebaseReady && window.firebaseReady === true) {
          membersRef.set(members)
            .then(() => console.log("Firebase sync saved"))
            .catch((error) => console.error("Firebase sync error:", error));
        } else {
          saveMembersLocal();
        }
      }

      function initializeFirebaseSync() {
        membersRef.on("value", (snapshot) => {
          const data = snapshot.val();
          members = Array.isArray(data) ? data : [];
          nextId = members.length > 0 ? Math.max(...members.map((m) => m.id), 0) + 1 : 1;
          updateMemberCount();
          renderMembers();
          window.firebaseReady = true;
          console.log("Firebase sync connected");
        }, () => {
          console.warn("Firebase connection failed. Using local fallback.");
          members = loadMembers();
          nextId = members.length > 0 ? Math.max(...members.map((m) => m.id), 0) + 1 : 1;
          updateMemberCount();
          renderMembers();
          window.firebaseReady = false;
        });
      }

      function getStatusClasses(status) {
        return status === "Active"
          ? "bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30"
          : "bg-rose-500/15 text-rose-300 ring-1 ring-rose-500/30";
      }

      function updateMemberCount() {
        memberCountDisplay.textContent = members.length;
      }

      function renderMembers() {
        const query = searchInput.value.trim().toLowerCase();
        const filtered = members.filter((member) => member.name.toLowerCase().includes(query));

        if (!filtered.length) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="5" class="px-4 py-10 text-center text-sm text-slate-400">
                ${members.length === 0 ? "No members yet. Add one to get started!" : "No members match your search."}
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = filtered
          .map((member) => {
            return `
              <tr class="draggable-row rounded-xl bg-slate-800/70 text-slate-100 shadow-sm ring-1 ring-slate-700/80" draggable="true" data-member-id="${member.id}">
                <td class="px-4 py-4 align-middle">
                  <div class="font-semibold text-white">${member.name}</div>
                </td>
                <td class="px-4 py-4 align-middle">
                  <input
                    type="text"
                    value="${member.rank}"
                    data-member-id="${member.id}"
                    class="rank-input rounded-lg border border-indigo-500/30 bg-indigo-500/10 px-2.5 py-1 text-xs font-medium text-indigo-200 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                  />
                </td>
                <td class="px-4 py-4 align-middle">
                  <label class="sr-only" for="status-${member.id}">Update status for ${member.name}</label>
                  <select
                    id="status-${member.id}"
                    data-member-id="${member.id}"
                    class="status-select rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm font-medium focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                    aria-label="Status for ${member.name}"
                  >
                    <option value="Active" ${member.status === "Active" ? "selected" : ""}>Active</option>
                    <option value="Inactive" ${member.status === "Inactive" ? "selected" : ""}>Inactive</option>
                  </select>
                </td>
                <td class="px-4 py-4 align-middle">
                  <label class="sr-only" for="merit-${member.id}">Update merit for ${member.name}</label>
                  <input
                    id="merit-${member.id}"
                    type="number"
                    value="${member.merit}"
                    data-member-id="${member.id}"
                    class="merit-input rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm font-semibold text-slate-100 w-20 focus:border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
                    aria-label="Merit for ${member.name}"
                  />
                </td>
                <td class="px-4 py-4 align-middle">
                  <button
                    data-member-id="${member.id}"
                    class="delete-btn rounded-lg bg-rose-600/20 px-3 py-1 text-xs font-medium text-rose-300 hover:bg-rose-600/40 transition"
                  >
                    Delete
                  </button>
                </td>
              </tr>
            `;
          })
          .join("");

        setupDragListeners();
      }

      function setupDragListeners() {
        const rows = tableBody.querySelectorAll(".draggable-row");

        rows.forEach((row) => {
          row.addEventListener("dragstart", (e) => {
            draggedElement = row;
            row.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });

          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            rows.forEach((r) => r.classList.remove("drag-over"));
            draggedElement = null;
          });

          row.addEventListener("dragover", (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
            if (row !== draggedElement) {
              row.classList.add("drag-over");
            }
          });

          row.addEventListener("dragleave", () => {
            row.classList.remove("drag-over");
          });

          row.addEventListener("drop", (e) => {
            e.preventDefault();
            if (draggedElement && draggedElement !== row) {
              const draggedIndex = Array.from(rows).indexOf(draggedElement);
              const targetIndex = Array.from(rows).indexOf(row);

              const draggedMemberId = parseInt(draggedElement.dataset.memberId);
              const draggedMember = members.find((m) => m.id === draggedMemberId);

              members.splice(draggedIndex, 1);
              members.splice(targetIndex, 0, draggedMember);

              saveMembersCloud();
              renderMembers();
            }
            row.classList.remove("drag-over");
          });
        });
      }

      function addMember() {
        const name = newNameInput.value.trim();
        const rank = newRankInput.value.trim();
        const rankOrder = parseInt(newRankOrderInput.value) || 1;
        const status = newStatusInput.value;
        const merit = parseInt(newMeritInput.value) || 0;

        if (!name || !rank) {
          alert("Please enter both Name and Rank");
          return;
        }

        members.push({
          id: nextId++,
          name,
          rank,
          rankOrder: Math.max(1, Math.min(5, rankOrder)),
          status,
          merit
        });

        saveMembersCloud();
        updateMemberCount();
        renderMembers();

        newNameInput.value = "";
        newRankInput.value = "";
        newRankOrderInput.value = "1";
        newStatusInput.value = "Active";
        newMeritInput.value = "0";
        newNameInput.focus();
      }

      searchInput.addEventListener("input", renderMembers);
      addMemberBtn.addEventListener("click", addMember);

      newMeritInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") addMember();
      });

      document.addEventListener("change", function (event) {
        const target = event.target;

        if (target.classList.contains("status-select")) {
          const memberId = Number(target.dataset.memberId);
          const newStatus = target.value;

          members = members.map((member) =>
            member.id === memberId ? { ...member, status: newStatus } : member
          );

          saveMembersCloud();
          renderMembers();
        }
      });

      document.addEventListener("input", function (event) {
        const target = event.target;

        if (target.classList.contains("rank-input")) {
          const memberId = Number(target.dataset.memberId);
          const newRank = target.value.trim();

          members = members.map((member) =>
            member.id === memberId ? { ...member, rank: newRank } : member
          );

          saveMembersCloud();
        }

        if (target.classList.contains("merit-input")) {
          const memberId = Number(target.dataset.memberId);
          let merit = parseInt(target.value) || 0;
          target.value = merit;

          members = members.map((member) =>
            member.id === memberId ? { ...member, merit } : member
          );

          saveMembersCloud();
        }
      });

      document.addEventListener("click", function (event) {
        if (!event.target.classList.contains("delete-btn")) return;

        const memberId = Number(event.target.dataset.memberId);
        if (confirm("Are you sure you want to delete this member?")) {
          members = members.filter((member) => member.id !== memberId);
          saveMembersCloud();
          updateMemberCount();
          renderMembers();
        }
      });

      members = loadMembers();
      nextId = members.length > 0 ? Math.max(...members.map((m) => m.id), 0) + 1 : 1;
      updateMemberCount();
      renderMembers();
      initializeFirebaseSync();
    </script>
  </body>
</html>
